<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEAK</title>
<!-- Every game file comes from this mirror; the old wasm.rip embed pointed at
     cdn.jsdelivr.net/gh/wasmdotrip/Peak-Port, which no longer exists (404). -->
<base href="https://seuss-arcade-relay.damonrosshutchins.workers.dev/approved-games/peak/">
<style>
  html,body{margin:0;height:100%;background:#000;color:#e8e8e8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  #unity-canvas{background:#000;max-width:100%;max-height:100%;outline:none;display:block;margin:0 auto}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;background:#000}
  #bar{width:320px;height:12px;margin-top:14px;border:1px solid #555;display:none}
  #barfill{width:0%;height:100%;background:#7cc242}
  #msg{color:#bbb;font:13px/1.5 system-ui,sans-serif;margin-top:10px;text-align:center;max-width:44ch}
  #fs{position:fixed;left:10px;bottom:12px;display:none;background:rgba(255,255,255,.08);color:#ddd;border:1px solid #555;border-radius:4px;padding:6px 12px;cursor:pointer;font:12px/1 system-ui,sans-serif}
  #fs:hover{background:rgba(255,255,255,.18)}
  #chip{position:fixed;right:10px;bottom:10px;z-index:10;color:#8a8a8a;font:12px/1.4 system-ui,sans-serif;text-align:right}
  #chip a{color:#7cc242;text-decoration:none}
  #chip a:hover{text-decoration:underline}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
  <div id="bar"><div id="barfill"></div></div>
  <div id="msg" role="status" aria-live="polite">Preparing PEAK…</div>
</div>
<button id="fs" type="button">Fullscreen</button>
<div id="chip">
  ported by @._.dasher._.<br>
  <a href="../../index.html">Library</a>
</div>
<script>
(function(){
  // Build manifest (same parts as the upstream port, served from the mirror).
  var MANIFEST={
    data:{file:"WebGL.data.unityweb",parts:["WebGL.data.unityweb.part000","WebGL.data.unityweb.part001","WebGL.data.unityweb.part002","WebGL.data.unityweb.part003","WebGL.data.unityweb.part004","WebGL.data.unityweb.part005","WebGL.data.unityweb.part006","WebGL.data.unityweb.part007","WebGL.data.unityweb.part008","WebGL.data.unityweb.part009","WebGL.data.unityweb.part010","WebGL.data.unityweb.part011","WebGL.data.unityweb.part012"],bytes:241608952},
    code:{file:"WebGL.wasm.unityweb",bytes:12657365},
    framework:{file:"WebGL.framework.js.unityweb",bytes:85982}
  };
  var MIRROR="https://seuss-arcade-relay.damonrosshutchins.workers.dev/approved-games/peak";
  var BUILD=MIRROR+"/Build";
  var TOTAL=MANIFEST.data.bytes+MANIFEST.code.bytes+MANIFEST.framework.bytes;
  var downloaded=0,CONCURRENCY=4;

  // The C# level streamer resolves bundle URLs against the page URL, so stamp the
  // mirror onto our own address the same way the upstream build does.
  try{
    var u=new URL(location.href);
    if(u.searchParams.get("cdn")!==MIRROR){u.searchParams.set("cdn",MIRROR);history.replaceState(null,"",u.toString());}
  }catch(error){}

  var canvas=document.querySelector("#unity-canvas"),bar=document.querySelector("#bar"),
      barfill=document.querySelector("#barfill"),msg=document.querySelector("#msg");
  function mb(bytes){return (bytes/1048576).toFixed(1);}
  function setMsg(text){msg.textContent=text;}
  function progress(percent,stage){
    bar.style.display="block";
    barfill.style.width=percent.toFixed(1)+"%";
    // Surface real load progress in the arcade shell when we are embedded.
    try{parent.postMessage({type:"seuss-arcade-progress",stage:stage||"Loading PEAK…",percent:percent},"*");}catch(error){}
  }
  function report(label){
    var pct=TOTAL?downloaded/TOTAL*100:0;
    setMsg("Downloading "+label+"… "+mb(downloaded)+" / "+mb(TOTAL)+" MB ("+Math.floor(pct)+"%)");
    progress(pct,"Downloading PEAK…");
  }

  // Fetch one part with a couple of retries; jsDelivr marks these immutable, so a
  // reload after the first run comes straight from the browser cache.
  function fetchPart(url,attempt){
    attempt=attempt||0;
    return fetch(url,{cache:"force-cache"}).then(function(res){
      if(!res.ok)throw new Error(url.slice(url.lastIndexOf("/")+1)+" ("+res.status+")");
      return res.arrayBuffer();
    }).then(function(buf){
      downloaded+=buf.byteLength;
      report("game files");
      return buf;
    }).catch(function(error){
      if(attempt>=2)throw error;
      return new Promise(function(resolve){setTimeout(resolve,900*(attempt+1));})
        .then(function(){return fetchPart(url,attempt+1);});
    });
  }

  // Several parts at once instead of one after another: the 242 MB data pack is
  // 13 x ~18 MB, so serial downloads were the slow part of the old loader.
  function assemble(entry,label){
    var urls=(entry.parts||[entry.file]).map(function(file){return BUILD+"/"+file;});
    var buffers=new Array(urls.length),next=0;
    function pool(){
      if(next>=urls.length)return Promise.resolve();
      var index=next++;
      return fetchPart(urls[index]).then(function(buf){
        buffers[index]=buf;
        return pool();
      });
    }
    var workers=[];
    for(var i=0;i<Math.min(CONCURRENCY,urls.length);i++)workers.push(pool());
    return Promise.all(workers).then(function(){
      return URL.createObjectURL(new Blob(buffers));
    });
  }

  (async function(){
    try{
      var dataUrl=await assemble(MANIFEST.data,"game data");
      var frameworkUrl=await assemble(MANIFEST.framework,"framework");
      var codeUrl=await assemble(MANIFEST.code,"code");
      setMsg("Starting…");
      progress(100,"Starting PEAK…");
      var script=document.createElement("script");
      script.src=BUILD+"/WebGL.loader.js";
      script.onload=function(){
        createUnityInstance(canvas,{
          dataUrl:dataUrl,
          frameworkUrl:frameworkUrl,
          codeUrl:codeUrl,
          streamingAssetsUrl:MIRROR+"/StreamingAssets",
          companyName:"Aggro Crab & Landfall",
          productName:"PEAK",
          productVersion:"1.62.a"
        },function(p){
          bar.style.display="block";
          barfill.style.width=Math.round(p*100)+"%";
          setMsg("Loading… "+Math.round(p*100)+"%");
          progress(Math.round(p*100),"Starting PEAK…");
        }).then(function(instance){
          window.unityInstance=instance;
          bar.style.display="none";
          setMsg("");
          progress(100,"Game ready");
          var fs=document.querySelector("#fs");
          fs.style.display="block";
          fs.onclick=function(){
            if(instance.SetFullscreen)instance.SetFullscreen(1);
            else if(canvas.requestFullscreen)canvas.requestFullscreen();
            canvas.focus();
          };
        }).catch(function(error){
          setMsg("Failed to start: "+error);
        });
      };
      script.onerror=function(){setMsg("Failed to load "+script.src);};
      document.body.appendChild(script);
    }catch(error){
      setMsg("Failed to download the game: "+error);
    }
  })();
})();
</script>
</body>
</html>
