<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <base href="https://cdn.jsdelivr.net/gh/reeyuki/tabs@3facd4136b3c5916914d3cdb7396a72e14c4efea/">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Totally Accurate Battle Simulator</title>
    <style>
        body {
            margin: 0;
            background: #050505;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #u {
            width: 100vw;

        }

        #l {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        #f {
            position: absolute;
            top: 15px;
            right: 15px;
            cursor: pointer;
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 4px;
            z-index: 20;

            transition: background 0.2s;
        }

        #f:hover {
            background: rgba(50, 50, 50, 0.9);
        }
    </style>
    <script src="Build/UnityLoader.js"></script>
</head>

<body>
<script>
/* Arcade loader guard: a silent stall or crash becomes a readable error with Retry.
   These ports load hundreds of megabytes from a CDN mirror, so a dead connection
   and a slow connection look identical on a progress bar; this separates them. */
(function () {
  var D = document, W = window;
  var STALL_MS = 120000, lastChange = Date.now(), shown = false;
  function progressBox() {
    var ids = ['loader-overlay', 'loader', 'l'];
    for (var i = 0; i < ids.length; i++) {
      var n = D.getElementById(ids[i]);
      if (!n || n.offsetParent === null) continue;
      var cs = W.getComputedStyle(n);
      if (cs.display !== 'none' && cs.visibility !== 'hidden') return n;
    }
    return null;
  }
  function touch() { lastChange = Date.now(); }
  function panel() {
    var b = D.getElementById('arcade-fatal');
    if (b) return b;
    b = D.createElement('div');
    b.id = 'arcade-fatal';
    b.setAttribute('role', 'alertdialog');
    b.innerHTML = '<h2>This game could not start</h2><p id="af-msg"></p><p id="af-detail" class="af-detail"></p>'
      + '<div class="af-btns"><button id="af-retry" type="button">Retry</button>'
      + '<a id="af-back" href="">Library</a></div>';
    var style = D.createElement('style');
    style.textContent = '#arcade-fatal{position:fixed;inset:0;z-index:2147483647;display:none;flex-direction:column;'
      + 'align-items:center;justify-content:center;gap:14px;background:rgba(8,8,10,.955);color:#e8e8e8;padding:28px;'
      + 'text-align:center;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}'
      + '#arcade-fatal h2{margin:0;font-size:15px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:#fff}'
      + '#arcade-fatal p{margin:0;max-width:540px;color:#b9b9b9}'
      + '#arcade-fatal .af-detail{font-size:12px;color:#7d7d7d;word-break:break-word}'
      + '#arcade-fatal .af-btns{display:flex;gap:10px;margin-top:8px}'
      + '#arcade-fatal button,#arcade-fatal a{border:1px solid #4a4a4a;background:#1b1b1d;color:#ededed;padding:9px 18px;'
      + 'border-radius:4px;font:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;'
      + 'text-decoration:none}#arcade-fatal button:hover,#arcade-fatal a:hover{background:#2a2a2e;border-color:#6a6a6a}';
    D.head.appendChild(style);
    D.body.appendChild(b);
    D.getElementById('af-retry').addEventListener('click', function () { location.reload(); });
    // Each launcher carries a <base> pointing at its CDN mirror, so an empty
    // href would send Library to jsDelivr. Resolve it against the page URL.
    D.getElementById('af-back').href = new URL('../../index.html', location.href).href;
    return b;
  }
  function fatal(msg, detail) {
    if (shown) return;
    shown = true;
    var b = panel();
    D.getElementById('af-msg').textContent = msg || 'The loader stopped responding.';
    D.getElementById('af-detail').textContent = detail ? String(detail).slice(0, 400) : '';
    b.style.display = 'flex';
  }
  var OOM = /array buffer|out of memory|allocation failed|invalid array length|outofmemory|memory limit/i;
  // These Unity ports request Pointer Lock and play an intro video before any
  // click exists, so the browser rejects both. Neither stops the game, and
  // turning them into a blocking panel made a working port look broken.
  var BENIGN = /pointer ?lock|user gesture|notallowederror|play\(\) failed|the play method|playback was interrupted|autoplay/i;
  function fail(e) {
    var m = (e && (e.message || (e.reason && e.reason.message))) || String(e || 'unknown error');
    if (BENIGN.test(m)) { if (W.console) W.console.info('[loader-guard] ignored benign startup error:', m); return; }
    if (OOM.test(m)) {
      fatal('The browser ran out of memory.',
        m + ' — this build expands to over a gigabyte in memory. Close other tabs and retry, or run it on a desktop with several GB of RAM free.');
    } else {
      fatal('The loader reported an error.', m);
    }
  }
  W.addEventListener('error', function (e) {
    if (e && e.target && e.target.tagName) {
      if (e.target.tagName === 'SCRIPT') fatal('A build file failed to download.', e.target.src || '');
      return;
    }
    fail(e);
  }, true);
  W.addEventListener('unhandledrejection', function (e) { fail(e.reason || e); });
  // Grant pointer lock on the next real click instead of losing it forever.
  try {
    var origLock = Element.prototype.requestPointerLock;
    if (origLock) {
      var lockTarget = null;
      Element.prototype.requestPointerLock = function () {
        var self = this, promise;
        try { promise = origLock.call(self); } catch (err) { lockTarget = self; return; }
        if (promise && typeof promise.catch === 'function') promise.catch(function () { lockTarget = self; });
        return promise;
      };
      D.addEventListener('click', function () {
        if (!lockTarget) return;
        try { origLock.call(lockTarget); } catch (err) {}
        lockTarget = null;
      }, true);
    }
  } catch (err) {}
  W.__arcadeGuard = { touch: touch, fatal: fatal, fail: fail };
  if (W.MutationObserver) new MutationObserver(touch).observe(D.documentElement, { childList: true, subtree: true, characterData: true });
  D.addEventListener('DOMContentLoaded', function () {
    var back = D.getElementById('af-back');
    if (back) back.href = new URL('../../index.html', location.href).href;
    touch();
  });
  setInterval(function () {
    if (shown) return;
    var p = progressBox();
    if (!p) { touch(); return; }
    var text = (p.textContent || '').trim();
    if (/error|failed|mismatch|retries/i.test(text) && /^(error|failed)/i.test(text)) {
      fatal('The loader reported an error.', text);
      return;
    }
    if (Date.now() - lastChange > STALL_MS) {
      var secs = Math.round(STALL_MS / 1000);
      fatal('Loading stalled.', 'Nothing new arrived for ' + secs + ' s. The mirror may be throttling this connection; Retry picks up from the browser cache.');
    }
  }, 2000);
})();
</script>
    <div id="l">Loading assets... 0%</div>
    <div id="f" onclick="u.SetFullscreen(1)">Fullscreen</div>
    <div id="u"></div>
    <script>
        const base = "";
        const dC = 78, wC = 3;
        let u, n = 0, t = dC + wC, blobs = {};
        const up = (v, m) => {
            document.getElementById('l').innerText = m + "... " + Math.round(v * 100) + "%";
        };

        // Generic fetch with retry
        async function fetchWithRetry(url, options = {}, retries = 3, delay = 1000) {
            for (let attempt = 0; attempt <= retries; attempt++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response;
                } catch (err) {
                    if (attempt === retries) throw err;
                    await new Promise(res => setTimeout(res, delay * (attempt + 1)));
                }
            }
        }

        const ld = async (s, c) => {
            const r = await Promise.all([...Array(c)].map(async (_, i) => {
                const url = base + "Build/tabs." + s + (i < 10 ? "0" + i : i);
                const x = await fetchWithRetry(url);
                const a = await x.arrayBuffer();
                n++;
                up(n / t, "Loading assets");
                return a;
            }));
            return new Blob(r).arrayBuffer();
        };

        const shim = () => {
            const ox = XMLHttpRequest.prototype.open, sx = XMLHttpRequest.prototype.send;
            XMLHttpRequest.prototype.open = function (m, url) { this._u = url; return ox.apply(this, arguments); };
            XMLHttpRequest.prototype.send = function () {
                const p = new URL(this._u, window.location.href).pathname;
                for (const k in blobs) if (p.endsWith(k)) {
                    setTimeout(() => {
                        Object.defineProperty(this, 'status', { value: 200 });
                        Object.defineProperty(this, 'readyState', { value: 4 });
                        Object.defineProperty(this, 'response', { value: blobs[k] });
                        this.dispatchEvent(new Event('load'));
                    }, 1);
                    return;
                }
                return sx.apply(this, arguments);
            };
        };

        (async () => {
            const [dB, wB] = await Promise.all([ld("data", dC), ld("wasm", wC)]);
            blobs["tabs.data.unityweb"] = dB;
            blobs["tabs.wasm.code.unityweb"] = wB;
            shim();
            u = UnityLoader.instantiate("u", base + "Build/tabs.json", {
                onProgress: (inst, v) => {
                    if (v < 1) up(v, "Initializing");
                    else document.getElementById('l').style.display = 'none';
                }
            });
        })();
    </script>
</body>

</html>
