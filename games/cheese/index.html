<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cheese Rolling — Arcade</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#141b24;color:#e6f6ff;font:15px/1.5 system-ui,sans-serif}
main{position:relative;width:100%;height:100%}
iframe{border:0;display:block;width:100%;height:100%;background:#0b121b}
#status{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:26px;background:#142033;text-align:center}
#status[hidden]{display:none}
.panel{max-width:560px;padding:24px;border:1px solid #6a8994;border-radius:15px;background:#1b2c41}
h1{margin:0 0 8px;font-size:23px}
p{color:#c0d5e5}
button{border:1px solid #6ecaba;border-radius:9px;background:#266b67;color:#fff;padding:11px 17px;cursor:pointer;font:inherit}
button:hover{background:#36847d}
button:focus-visible{outline:3px solid #ffe3a2;outline-offset:3px}
</style>
</head>
<body>
<main>
<iframe id="game" title="Cheese Rolling" allow="fullscreen; gamepad; autoplay; pointer-lock" allowfullscreen
 sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock" referrerpolicy="no-referrer"></iframe>
<div id="status" role="status" aria-live="polite"><div class="panel">
<h1>Cheese Rolling</h1>
<p id="message">Checking the Cheese Rolling build on jsDelivr…</p>
<button type="button" id="retry" hidden>Try again</button>
</div></div>
</main>
<script>
"use strict";
// The game document is served by jsDelivr, pinned to one commit. jsDelivr sends
// the Unity loader with a real JavaScript MIME type and CORS headers, whereas
// raw.githubusercontent.com refuses to be framed at all (X-Frame-Options: deny)
// and marks its scripts text/plain. So fetch the document and inline it here,
// keeping a <base> on jsDelivr for its split Build parts.
const cdn="https://cdn.jsdelivr.net/gh/SomeRandomFella/portsandrips@9546494b3052e8e078fb28df7430ac35f42a8787/CheeseRollingWeb/";
const game=document.getElementById("game");
const status=document.getElementById("status");
const message=document.getElementById("message");
const retry=document.getElementById("retry");
async function launch(){
  status.hidden=false;
  retry.hidden=true;
  game.removeAttribute("src");
  game.removeAttribute("srcdoc");
  message.textContent="Downloading the Cheese Rolling launcher from jsDelivr…";
  try{
    const response=await fetch(cdn+"index.html",{cache:"no-store"});
    if(!response.ok)throw new Error("jsDelivr returned "+response.status+" for index.html");
    let html=await response.text();
    // The upstream document points its own <base> at the moving @master branch.
    // Replace it so every split part comes from this exact pinned build.
    html=html.replace(/<base\b[^>]*>/gi,"");
    if(!/<head[^>]*>/i.test(html))throw new Error("The upstream game document has no <head> element.");
    html=html.replace(/<head([^>]*)>/i,'<head$1><base href="'+cdn+'">');
    // Unity's loader resolves this against document.URL, which is about:srcdoc
    // here, so it must already be absolute or the loader throws before starting.
    html=html.replace(/(streamingAssetsUrl\s*:\s*)(["'])StreamingAssets\2/, '$1$2'+cdn+'StreamingAssets$2');
    message.textContent="Loading the split Unity build through jsDelivr…";
    game.onload=()=>{status.hidden=true;};
    game.srcdoc=html;
  }catch(error){
    message.textContent="Cheese Rolling could not load from jsDelivr. "+
      (error.message||String(error))+
      " The pinned game source may be temporarily unavailable.";
    retry.hidden=false;
  }
}
retry.onclick=()=>void launch();
void launch();
</script>
</body>
</html>
