<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cheese Rolling — Arcade</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#141b24;color:#e6f6ff;font:15px/1.5 system-ui,sans-serif}
main{position:relative;width:100%;height:100%}
iframe{border:0;display:block;width:100%;height:100%;background:#0b121b}
#status{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:26px;background:#142033;text-align:center}
#status[hidden]{display:none}
.panel{max-width:560px;padding:24px;border:1px solid #6a8994;border-radius:15px;background:#1b2c41}
h1{margin:0 0 8px;font-size:23px}
p{color:#c0d5e5}
button{border:1px solid #6ecaba;border-radius:9px;background:#266b67;color:#fff;padding:11px 17px;cursor:pointer;font:inherit}
button:hover{background:#36847d}
button:focus-visible{outline:3px solid #ffe3a2;outline-offset:3px}
</style>
</head>
<body>
<main>
<iframe id="game" title="Cheese Rolling" allow="fullscreen; gamepad; autoplay; pointer-lock" allowfullscreen
 sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock" referrerpolicy="no-referrer"></iframe>
<div id="status" role="status" aria-live="polite"><div class="panel">
<h1>Cheese Rolling</h1>
<p id="message">Checking the approved Render game connection…</p>
<button type="button" id="retry" hidden>Try again</button>
</div></div>
</main>
<script>
"use strict";
const base="https://seuss-cinema-arcade.onrender.com/approved-games/cheese/";
const game=document.getElementById("game");
const status=document.getElementById("status");
const message=document.getElementById("message");
const retry=document.getElementById("retry");
async function launch(){
  status.hidden=false;
  retry.hidden=true;
  game.removeAttribute("src");
  message.textContent="Checking the approved Render game connection…";
  try{
    const response=await fetch(base+"status",{mode:"cors",cache:"no-store",signal:AbortSignal.timeout(15000)});
    const detail=await response.json().catch(()=>({}));
    if(!response.ok||!detail.ok){
      throw Error(detail.note||"The upstream game is temporarily unavailable (HTTP "+response.status+").");
    }
    message.textContent="Loading Cheese Rolling from the approved game server…";
    game.onload=()=>{status.hidden=true;};
    game.src=base+"index.html";
  }catch(error){
    message.textContent="Cheese Rolling could not connect through the restricted Render game route. "+
      (error.message||String(error))+
      " This may mean the original game server is unavailable.";
    retry.hidden=false;
  }
}
retry.onclick=()=>void launch();
void launch();
</script>
</body>
</html>
