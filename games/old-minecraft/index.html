<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Old Minecraft · Seuss Arcade</title><script src="../../cloak.js"></script><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1210;color:#f2fbf5;font:14px system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column}
header{background:#182a1f;border-bottom:1px solid #4a7a5b;display:flex;align-items:center;gap:12px;padding:10px 15px;flex-wrap:wrap}
header strong{font-size:16px}header span{color:#bcdac6;font-size:12px;flex:1}
button,a{border:1px solid #7ab98a;border-radius:8px;padding:9px 12px;background:#2f5f3f;color:white;cursor:pointer;text-decoration:none;font:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #ffe09c;outline-offset:2px}
main{flex:1;display:flex;flex-direction:column;min-height:0}
#status{padding:8px 15px;color:#d6f0de;margin:0;background:#1b3024}
iframe{display:block;flex:1;min-height:65vh;width:100%;border:0;background:#0d1210}
</style></head>
<body><header><strong>⛏ Old Minecraft</strong><span>The Legacy Console launcher runs inside this GitHub Pages player, so the address bar stays on this site.</span>
<a href="../../index.html">← Back to Arcade</a><button id="reload" type="button">↻ Reload game</button></header>
<main><p id="status" role="status" aria-live="polite">Loading the Legacy Console launcher through the Seuss relay…</p>
<iframe id="game" title="Old Minecraft" allow="fullscreen; gamepad; autoplay; pointer-lock; clipboard-write" allowfullscreen referrerpolicy="no-referrer"></iframe></main>
<script>
// The launcher's publisher sends X-Frame-Options: DENY, so the relay mirrors the
// site and drops the framing headers. Framing that mirror keeps the launcher's
// own /api/play-session and /play routes on the relay origin, which its Play
// button needs, while this page and the address bar stay on GitHub Pages.
const RELAY_ROOT = "https://seuss-arcade-relay.damonrosshutchins.workers.dev/";
const frame = document.getElementById("game");
const status = document.getElementById("status");
function load() {
  status.textContent = "Loading the Legacy Console launcher through the Seuss relay…";
  frame.src = RELAY_ROOT;
}
frame.addEventListener("load", () => {
  status.textContent = "Launcher loaded inside the GitHub Pages arcade. Pick an edition to play.";
});
frame.addEventListener("error", () => {
  status.textContent = "The launcher could not load from the relay. Use Reload game to retry.";
});
document.getElementById("reload").addEventListener("click", load);
load();
</script></body></html>
