    status.textContent = "This game needs 64-bit WebAssembly memory (memory64): use a current Chrome, Edge, or Brave.";
  } else if (!self.crossOriginIsolated) {
    status.textContent = "This host must send cross-origin-isolation headers before real threads can run.";
  }
})();

  </script>
  <script>
/* Player name before the game loads: kept in this browser with a random player ID, handed to the game (offline Steam
   signs that player in, so there's no "not logged in" notice and the name shows in game), then the game starts. */
(() => {
  "use strict";

  const NAME_KEY = "uewUserName", ID_KEY = "uewUserId";
  const load = key => { try { return localStorage.getItem(key); } catch (e) { return null; } };
  const save = (key, value) => { try { localStorage.setItem(key, value); } catch (e) {} };

  // a player ID per browser, so different people's accounts stay apart (31 bits, never 0)
  let id = Number(load(ID_KEY)) | 0;
  if (id <= 0) {
    const r = new Uint32Array(1);
    crypto.getRandomValues(r);
    id = (r[0] & 0x7fffffff) || 1;
    save(ID_KEY, String(id));
  }

  const valid = name => /^[A-Za-z0-9 _.\-]{2,20}$/.test(name) && name.trim().length >= 2;

  const start = name => {
    save(NAME_KEY, name);
    window.Module.uewUserName = name;
    window.Module.uewUserId = id;
    document.getElementById("account").remove();
    const s = document.createElement("script");
    s.src = window.uewGameUrl; // game.js, from inside this file
    document.body.appendChild(s);
    document.getElementById("canvas").focus();
  };

  const box = document.getElementById("account");
  const input = box.querySelector("input");
  const button = box.querySelector("button");
  const hint = box.querySelector(".hint");
  input.value = load(NAME_KEY) || "";
  box.querySelector(".id").textContent = `Player ID ${id}`;
  const check = () => {
    const ok = valid(input.value.trim());
    button.disabled = !ok;
    hint.textContent = ok || !input.value ? "" : "2 to 20 letters, numbers, spaces, _ - or .";
  };
  input.addEventListener("input", check);
  box.addEventListener("submit", e => {
    e.preventDefault();
    const name = input.value.trim();
    if (valid(name)) start(name);
  });
  check();
  document.getElementById("status").textContent = "";
  input.focus();
  input.select();
})();

  </script>
  <script>
    // what the cooperative build needs from the browser: WebGPU (a secure context: https, localhost or a file on disk)
    // and JSPI, which switches the game's threads (Chrome and Edge 137 and later)
    (() => {
      const box = document.getElementById("account");
      const why = !window.isSecureContext ? "Open this file from disk, or over HTTPS: the browser only offers WebGPU there."
        : !("gpu" in navigator) ? "This browser has no WebGPU. Use a current Chrome or Edge."
        : typeof WebAssembly.Suspending != "function" ? "This browser can't run the game's threads (no WebAssembly JSPI). Use Chrome or Edge 137 or later."
        : "";
      if (!why || !box) return;
      box.querySelector("button").disabled = true;
      box.querySelector("input").disabled = true;
      box.querySelector(".hint").textContent = why;
    })();
  </script>
