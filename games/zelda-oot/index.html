<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Legend of Zelda: Ocarina of Time · Seuss Arcade</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100%;color:#f5fff9;font:15px system-ui,sans-serif;background:#080d10}
#setup{max-width:680px;margin:6vh auto;padding:22px 24px;background:#15271e;border:1px solid #5a866d;border-radius:12px}
h1{margin-top:0}p{line-height:1.6;color:#cde2d6}label{display:block;margin:12px 0 6px}
select,button{border:1px solid #93b99a;background:#234e36;color:#fff;font:inherit;border-radius:8px;padding:10px 15px}
button{cursor:pointer;margin-top:12px}button:disabled{opacity:.5;cursor:wait}
#message{white-space:pre-wrap;color:#e2f1d8;margin-top:14px;min-height:2em}
#game{display:none;width:100%;height:100dvh;min-height:350px;overflow:hidden;position:relative;background:#000}
#game .ejs_parent{width:100%;height:100%}#game canvas{max-width:100%}
</style></head><body>
<section id="setup">
<h1>The Legend of Zelda: Ocarina of Time</h1>
<p>This version uses the stable EmulatorJS runtime and loads the game through the arcade's approved Render routes.</p>
<label for="core">Emulator</label>
<select id="core"><option value="n64">Default (n64)</option><option value="parallel-n64">Alternative (Parallel N64)</option></select>
<label><input id="legacy" type="checkbox"> Use legacy WebGL 1 graphics</label>
<p>If the screen is black, use the arcade's Reload button and select the other core or legacy graphics.</p>
<button id="play" type="button">Start Zelda</button>
<div id="message" role="status" aria-live="polite">Ready.</div>
</section>
<div id="game"></div>
<script>
"use strict";
const ROOT="https://seuss-cinema-arcade.onrender.com/approved-assets/imported/";
const RUNTIME=ROOT+"emu-stable/";
const GAME=ROOT+"zelda-oot/rom.n64";
const message=document.getElementById("message");
const play=document.getElementById("play");
function status(stage,percent=null){
 message.textContent=stage;
 try{if(window.parent!==window)window.parent.postMessage({type:"seuss-arcade-progress",stage,percent},location.origin);}catch(_){}
}
function showSetup(error){
 document.getElementById("setup").style.display="block";
 document.getElementById("game").style.display="none";
 play.disabled=false;
 status(String(error||"Unable to start the emulator"));
}
function checkVideo(){
 const canvas=document.querySelector("#game canvas.ejs_canvas");
 if(!canvas)return status("Emulator started but no video canvas exists. Reload and select the other core.");
 const b=canvas.getBoundingClientRect();
 if(b.width<2||b.height<2||canvas.width<2||canvas.height<2)
   return status("Video canvas is zero-sized. Reload and choose the other graphics setting.");
 try{window.EJS_emulator?.handleResize?.();}catch(e){console.warn("Video resizing failed",e);}
 status("Zelda core started · video canvas "+canvas.width+" × "+canvas.height,100);
}
window.addEventListener("error",event=>{
 if(document.getElementById("setup").style.display==="none"&&event.message)
   status("Emulator error: "+event.message+" · Reload to try the other core.");
});
window.addEventListener("unhandledrejection",event=>{
 if(document.getElementById("setup").style.display==="none")
   status("Emulator error: "+(event.reason?.message||String(event.reason)));
});
play.addEventListener("click",async()=>{
 play.disabled=true;
 status("Checking approved game and stable emulator routes…");
 try{
  for(const [name,url] of [["Emulator loader",RUNTIME+"loader.js"],["Game file",GAME]]){
   const response=await fetch(url,{method:"HEAD",signal:AbortSignal.timeout(40000),cache:"no-store"});
   if(!response.ok)throw Error(name+" returned HTTP "+response.status);
  }
  window.EJS_player="#game";
  window.EJS_core=document.getElementById("core").value;
  window.EJS_gameName="The Legend of Zelda: Ocarina of Time";
  window.EJS_color="#4cb07a";
  window.EJS_pathtodata=RUNTIME;
  window.EJS_gameUrl=GAME;
  window.EJS_startOnLoaded=true;
  window.EJS_threads=false;
  window.EJS_forceLegacyCores=document.getElementById("legacy").checked;
  window.EJS_disableLocalStorage=true;
  window.EJS_ready=()=>status("Emulator ready · loading Zelda game files…");
  window.EJS_onGameStart=()=>{status("Emulator initialized · starting video…");requestAnimationFrame(checkVideo);setTimeout(checkVideo,500);setTimeout(checkVideo,1500);};
  document.getElementById("game").style.display="block";
  document.getElementById("setup").style.display="none";
  status("Downloading game and graphics core through Render…");
  const script=document.createElement("script");
  script.src=RUNTIME+"loader.js";
  script.onerror=()=>showSetup("Could not load the official EmulatorJS loader through Render.");
  document.body.appendChild(script);
 }catch(error){showSetup("Launch failed: "+(error.message||String(error)));}
});
</script></body></html>
