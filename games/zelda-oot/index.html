<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Legend of Zelda: Ocarina of Time · Seuss Arcade</title>
<style>html,body{margin:0;background:#0c1712;color:#effff4;font:15px system-ui;height:100%}#game{display:none;position:relative;width:100vw;height:100dvh;min-height:360px;overflow:hidden}#game .ejs_parent,#game .ejs_game{min-height:360px}#game canvas{display:block;max-width:100%}#panel{padding:24px;max-width:620px;margin:5vh auto}button{background:#2e6445;border:1px solid #99d2aa;color:white;padding:12px 20px;border-radius:8px;cursor:pointer}#status{line-height:1.5;color:#e8e0b7;white-space:pre-wrap}</style></head><body>
<div id="panel"><h1>🗡️ The Legend of Zelda: Ocarina of Time</h1><p>Runs inside the Seuss Arcade using approved game and emulator routes on Render.</p><label for="core" style="display:block;margin:14px 0 6px">Graphics / emulator core</label><select id="core" style="font:inherit;padding:10px;border-radius:8px;background:#172822;color:#fff;border:1px solid #84a691"><option value="parallel_n64">Parallel N64 (compatibility)</option><option value="n64">Mupen64Plus Next (original)</option></select><label style="display:block;margin:12px 0"><input id="legacy" type="checkbox" checked> Use compatibility graphics (WebGL 1)</label><p style="color:#bad4c6;font-size:13px">If you hear sound with a black screen, use Reload in the arcade player and try the other core or turn off compatibility graphics.</p><button id="start" type="button">Start game</button><p id="status" role="status">Ready.</p></div><div id="game"></div>
<script>
const BASE="https://seuss-cinema-arcade.onrender.com/approved-assets/imported/";
const status=document.getElementById("status"),start=document.getElementById("start");
async function fetchPart(name){
 const response=await fetch(BASE+name,{mode:"cors"});
 if(!response.ok)throw Error(name+" returned HTTP "+response.status);
 return response.arrayBuffer();
}
start.addEventListener("click",async()=>{
 start.disabled=true;
 try{
  status.textContent="Downloading Ocarina of Time game parts…";
  const chunks=[];
  for(let n=1;n<=2;n++){chunks.push(await fetchPart("zelda-oot/rom.n64.part"+n));status.textContent="Downloaded part "+n+" of 2";}
  const gameUrl=URL.createObjectURL(new Blob(chunks,{type:"application/octet-stream"}));
  status.textContent="Starting Nintendo 64 emulator…";
  window.EJS_player="#game";window.EJS_core=document.getElementById("core").value;window.EJS_gameName="The Legend of Zelda: Ocarina of Time";
  window.EJS_color="#0064ff";window.EJS_startOnLoaded=true;
  window.EJS_pathtodata=BASE+"emu/";window.EJS_gameUrl=gameUrl;
  window.EJS_forceLegacyCores=document.getElementById("legacy").checked;
  window.EJS_threads=false;
  window.EJS_defaultOptions={vsync:"disabled"};
  document.getElementById("game").style.display="block";
  document.getElementById("panel").style.display="none";
  const script=document.createElement("script");script.src=BASE+"emu/loader.js";
  script.onerror=()=>{document.getElementById("panel").style.display="block";status.textContent="Emulator loader failed to download from Render.";start.disabled=false;};
  script.addEventListener("load",()=>{requestAnimationFrame(()=>{window.dispatchEvent(new Event("resize"));});});
  document.body.appendChild(script);
 }catch(e){status.textContent="Download failed: "+(e.message||String(e))+". Check the approved Render route.";start.disabled=false;}
});
</script></body></html>
