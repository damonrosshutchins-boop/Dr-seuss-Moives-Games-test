<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centipede (Arcade) · Seuss Arcade</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100%;color:#f5fff9;font:15px system-ui,sans-serif;background:#080d10}
#setup{max-width:680px;margin:6vh auto;padding:22px 24px;background:#15271e;border:1px solid #5a866d;border-radius:12px}
h1{margin-top:0}p{line-height:1.6;color:#cde2d6}label{display:block;margin:12px 0 6px}
select,button{border:1px solid #93b99a;background:#254d48;color:#fff;font:inherit;border-radius:8px;padding:10px 15px}
button{cursor:pointer;margin-top:12px}button:disabled{opacity:.5;cursor:wait}
#message{white-space:pre-wrap;color:#e2f1d8;margin-top:14px;min-height:2em}
#game{display:none;position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;min-width:320px;min-height:240px;overflow:hidden;background:#000}
#game .ejs_parent,#game .ejs_canvas_parent{width:100%!important;height:100%!important;min-width:320px;min-height:240px;position:relative}
#game canvas.ejs_canvas{display:block!important;width:100%!important;height:100%!important;max-width:100%;object-fit:contain;visibility:visible!important}
</style></head><body>
<section id="setup">
<h1>Centipede (Arcade)</h1>
<p>This version uses the stable EmulatorJS runtime and loads the game through the arcade's approved Render routes.</p>
<label for="core">Emulator</label>
<select id="core"><option value="mame2003">Default (mame2003)</option><option value="mame2003_plus">Alternative (MAME 2003 Plus)</option></select>
<label><input id="legacy" type="checkbox"> Use legacy WebGL 1 graphics</label>
<p>If the screen is black, use the arcade's Reload button and select the other core or legacy graphics.</p>
<button id="play" type="button">Start Centipede</button>
<div id="message" role="status" aria-live="polite">Ready.</div>
</section>
<div id="game"></div>
<script>
"use strict";
const ROOT="https://seuss-cinema-arcade.onrender.com/approved-assets/imported/";
const RUNTIME=ROOT+"emu-stable/";
const GAME=ROOT+"centipede/rom.zip";
const message=document.getElementById("message");
const play=document.getElementById("play");
function status(stage,percent=null){
 message.textContent=stage;
 try{if(window.parent!==window)window.parent.postMessage({type:"seuss-arcade-progress",stage,percent},location.origin);}catch(_){}
}
function showSetup(error){
 document.getElementById("setup").style.display="block";
 document.getElementById("game").style.display="none";
 play.disabled=false;
 status(String(error||"Unable to start the emulator"));
}
// Keep a real-sized rendering surface throughout emulator initialization.
// The official EmulatorJS embed example uses a sized parent; its canvas can
// otherwise inherit zero height during startup in an embedded flex iframe.
let monitorTimer=null,videoObserver=null,videoRescueAttempted=false;
function resizeVideo(){
 const emulator=window.EJS_emulator;
 try{emulator?.frontend?.handleResize?.();}catch(error){console.warn("EmulatorJS resize:",error);}
}
function checkVideo(tries=0){
 const host=document.getElementById("game");
 if(host.style.display==="none")return;
 const emulator=window.EJS_emulator;
 const canvas=emulator?.frontend?.canvas||host.querySelector("canvas.ejs_canvas");
 const parent=host.querySelector(".ejs_parent");
 const hostRect=host.getBoundingClientRect();
 // This is the documented embedding element, not the canvas bitmap.
 if(hostRect.width<2||hostRect.height<2){
   host.style.width=Math.max(320,window.innerWidth)+"px";
   host.style.height=Math.max(240,window.innerHeight)+"px";
 }
 resizeVideo();
 if(canvas){
   const view=canvas.getBoundingClientRect();
   const validCSS=view.width>=2&&view.height>=2;
   const validBitmap=canvas.width>=2&&canvas.height>=2;
   if(validCSS&&validBitmap){
     status("Centipede video surface initialized ("+canvas.width+" × "+canvas.height+").",100);
     return;
   }
   // Only recover a bitmap that the emulator left at 0×0. Do not reset an
   // already initialized WebGL drawing buffer because that would erase video.
   if(tries>=8&&!videoRescueAttempted&&validCSS&&!validBitmap){
     videoRescueAttempted=true;
     const width=Math.min(1920,Math.max(320,Math.round(view.width*(devicePixelRatio||1))));
     const height=Math.min(1080,Math.max(240,Math.round(view.height*(devicePixelRatio||1))));
     try{
       if(typeof emulator?.Module?.setCanvasSize==="function")
         emulator.Module.setCanvasSize(width,height);
       else {canvas.width=width;canvas.height=height;}
       resizeVideo();
     }catch(error){console.warn("Video surface recovery:",error);}
   }
 }
 if(tries>=40){
   const details="host "+Math.round(host.getBoundingClientRect().width)+"×"+Math.round(host.getBoundingClientRect().height)+
     ", parent "+Math.round(parent?.getBoundingClientRect().width||0)+"×"+Math.round(parent?.getBoundingClientRect().height||0)+
     ", canvas "+(canvas?.width||0)+"×"+(canvas?.height||0);
   status("Video output could not initialize ("+details+"). Try another emulator core or check WebGL support.");
   return;
 }
 monitorTimer=setTimeout(()=>checkVideo(tries+1),250);
}
function beginVideoMonitor(){
 if(monitorTimer!==null)clearTimeout(monitorTimer);
 videoRescueAttempted=false;
 if(!videoObserver&&typeof ResizeObserver!=="undefined"){
   videoObserver=new ResizeObserver(()=>resizeVideo());
   videoObserver.observe(document.getElementById("game"));
 }
 requestAnimationFrame(()=>checkVideo(0));
}
window.addEventListener("resize",resizeVideo,{passive:true});
window.addEventListener("error",event=>{
 if(document.getElementById("setup").style.display==="none"&&event.message)
   status("Emulator error: "+event.message+" · Reload to try the other core.");
});
window.addEventListener("unhandledrejection",event=>{
 if(document.getElementById("setup").style.display==="none")
   status("Emulator error: "+(event.reason?.message||String(event.reason)));
});
play.addEventListener("click",async()=>{
 play.disabled=true;
 status("Checking approved game and stable emulator routes…");
 try{
  let runtime=RUNTIME;
  const check=async url=>{
    try{return await fetch(url,{method:"HEAD",signal:AbortSignal.timeout(40000),cache:"no-store"});}
    catch(error){return {ok:false,status:"network error: "+(error.message||String(error))};}
  };
  // The pinned Render route is preferred. Official EmulatorJS CDN is an
  // approved public-runtime fallback if the new Render route isn't live yet.
  const loaderHead=await check(runtime+"loader.js");
  if(!loaderHead.ok){
    runtime="https://cdn.emulatorjs.org/stable/data/";
    status("Render emulator route unavailable. Trying official stable runtime…");
    const fallbackHead=await check(runtime+"loader.js");
    if(!fallbackHead.ok)throw Error("Official emulator runtime unavailable ("+fallbackHead.status+")");
  }
  let gameUrl=GAME;
  const gameHead=await check(GAME);
  if(!gameHead.ok)throw Error("Centipede game route returned "+gameHead.status);
  status("Approved resources located · starting official emulator…");
  window.EJS_player="#game";
  window.EJS_core=document.getElementById("core").value;
  window.EJS_gameName="Centipede (Arcade)";
  window.EJS_color="#4cb07a";
  window.EJS_pathtodata=runtime;
  window.EJS_gameUrl=gameUrl;
  window.EJS_startOnLoaded=true;
  window.EJS_threads=false;
  window.EJS_forceLegacyCores=document.getElementById("legacy").checked;
  window.EJS_disableLocalStorage=true;
  window.EJS_ready=()=>status("Emulator ready · loading Centipede game files…");
  window.EJS_onGameStart=()=>{status("Emulator initialized · preparing video surface…");beginVideoMonitor();};
  document.getElementById("game").style.display="block";
  document.getElementById("setup").style.display="none";
  status("Downloading game and graphics core through Render…");
  const script=document.createElement("script");
  script.src=runtime+"loader.js";
  script.onerror=()=>showSetup("Could not load the official EmulatorJS loader through Render.");
  document.body.appendChild(script);
 }catch(error){showSetup("Launch failed: "+(error.message||String(error)));}
});
</script></body></html>
