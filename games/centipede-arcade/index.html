<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centipede Arcade · Seuss Arcade</title>
<style>html,body{margin:0;background:#060a0c;color:#fff;font:15px system-ui;height:100%}#game{display:none;position:relative;width:100vw;height:100dvh;min-height:360px;overflow:hidden}#game .ejs_parent,#game .ejs_game{min-height:360px}#game canvas{display:block;max-width:100%}#panel{padding:24px;max-width:600px;margin:8vh auto}button{background:#2a6d4c;border:1px solid #9cd4a9;color:white;padding:12px 22px;border-radius:8px;cursor:pointer}#status{line-height:1.5;color:#ecdfa8;white-space:pre-wrap}</style></head><body>
<section id="panel"><h1>🐛 Centipede (Arcade)</h1><p>Launch the classic arcade game in the Seuss Arcade player with emulator and game assets from approved Render routes.</p><label for="core" style="display:block;margin:14px 0 6px">Graphics / emulator core</label><select id="core" style="font:inherit;padding:10px;border-radius:8px;background:#172822;color:#fff;border:1px solid #84a691"><option value="mame2003">MAME 2003 (compatibility)</option><option value="arcade">FBNeo (original)</option></select><label style="display:block;margin:12px 0"><input id="legacy" type="checkbox" checked> Use compatibility graphics (WebGL 1)</label><p style="color:#bad4c6;font-size:13px">If you hear sound with a black screen, use Reload in the arcade player and try the other core or turn off compatibility graphics.</p><button id="play">PLAY</button><p id="status" role="status">Ready.</p></section><div id="game"></div>
<script>
const BASE="https://seuss-cinema-arcade.onrender.com/approved-assets/imported/";
const status=document.getElementById("status"),play=document.getElementById("play");
const EXPECTED_GAME_BYTES=8739;
function report(stage,percent=null){
 status.textContent=stage;
 if(window.parent!==window)window.parent.postMessage({type:"seuss-arcade-progress",stage,percent},location.origin);
}
async function downloadGame(){
 const res=await fetch(BASE+"centipede/rom.zip",{method:"GET",mode:"cors"});
 if(!res.ok)throw Error("Game archive returned HTTP "+res.status);
 if(!res.body){const data=await res.arrayBuffer();report("Centipede archive downloaded · "+data.byteLength+" bytes",100);return data;}
 const reader=res.body.getReader(),chunks=[];let bytes=0;
 for(;;){
  const {value,done}=await reader.read();
  if(done)break;
  chunks.push(value);bytes+=value.byteLength;
  report("Downloading Centipede · "+bytes+" / "+EXPECTED_GAME_BYTES+" bytes",Math.min(100,bytes/EXPECTED_GAME_BYTES*100));
 }
 const result=new Uint8Array(bytes);let offset=0;
 for(const chunk of chunks){result.set(chunk,offset);offset+=chunk.byteLength;}
 report("Centipede archive downloaded · "+bytes+" bytes",100);
 return result.buffer;
}
play.addEventListener("click",async()=>{
 play.disabled=true;report("Downloading Centipede arcade game…",0);
 try{
  const gameUrl=URL.createObjectURL(new Blob([await downloadGame()],{type:"application/zip"}));
  report("Game download complete · starting arcade emulator…");
  window.EJS_ready=()=>report("Arcade emulator ready · initializing game…");
  window.EJS_onGameStart=()=>report("Centipede is running",100);
  window.EJS_player="#game";window.EJS_core=document.getElementById("core").value;window.EJS_gameName="Centipede";
  window.EJS_color="#000000";window.EJS_startOnLoaded=true;
  window.EJS_pathtodata=BASE+"emu/";window.EJS_gameUrl=gameUrl;
  window.EJS_forceLegacyCores=document.getElementById("legacy").checked;
  window.EJS_threads=false;
  document.getElementById("panel").style.display="none";
  document.getElementById("game").style.display="block";
  const script=document.createElement("script");script.src=BASE+"emu/loader.js";
  script.onerror=()=>{document.getElementById("panel").style.display="block";report("Emulator loader could not be downloaded.",0);play.disabled=false;};
  script.addEventListener("load",()=>{requestAnimationFrame(()=>{window.dispatchEvent(new Event("resize"));});});
  document.body.appendChild(script);
 }catch(e){report("Download failed: "+(e.message||String(e))+". Check the approved Render asset route.",0);play.disabled=false;}
});
</script></body></html>
