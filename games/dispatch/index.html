<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dispatch — Arcade</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#141b24;color:#e6f6ff;font:15px/1.5 system-ui,sans-serif}
iframe{border:0;display:block;width:100%;height:100%;background:#0b121b}
#status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#142033;text-align:center}
#status[hidden]{display:none}
.panel{max-width:540px;padding:22px;border:1px solid #6a8994;border-radius:14px;background:#1b2c41}
h1{margin:0 0 8px;font-size:22px}
p{margin:0;color:#c0d5e5}
</style>
</head>
<body>
<iframe id="game" title="Dispatch" allow="fullscreen; gamepad; autoplay; pointer-lock" allowfullscreen
 src="https://seuss-arcade-relay.damonrosshutchins.workers.dev/approved-games/dispatch/"></iframe>
<div id="status" role="status" aria-live="polite"><div class="panel">
<h1>Dispatch</h1>
<p id="message">Opening the Unreal Engine port through the Cloudflare relay…</p>
</div></div>
<script>
"use strict";
const frame=document.getElementById("game");
const status=document.getElementById("status");
const message=document.getElementById("message");
const slow=setTimeout(()=>{
  message.textContent="Still opening. The port streams its game data through the relay, so the first run takes a while.";
},15000);
frame.addEventListener("load",()=>{clearTimeout(slow);status.hidden=true;},{once:true});
</script>
</body>
</html>
