<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft 26.3 Rust · Seuss Arcade</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#090e12;color:#e7f4e8;font:15px system-ui,sans-serif}
header{height:48px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#15251d;border-bottom:1px solid #3d694e}
header a{color:#b5edcb;text-decoration:none}header strong{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
button{border:1px solid #7ab78b;background:#294936;color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}
iframe{width:100%;height:calc(100% - 48px);border:0;background:#000;display:block}
#notice{position:absolute;top:60px;left:12px;right:12px;max-width:580px;margin:auto;background:#15241de8;border:1px solid #7ab78b;padding:14px;border-radius:12px;box-shadow:0 12px 30px #0008}
#notice[hidden]{display:none}#notice p{line-height:1.5}
</style></head><body>
<header><a href="../../index.html">← Arcade</a><strong>⛏ Minecraft 26.3 Rust (Horizon)</strong><button id="reload">Reload</button><button id="fullscreen">Fullscreen</button></header>
<iframe id="game" title="Minecraft 26.3 Rust" src="https://alexboops.github.io/mc-rust-onweb/" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write" allowfullscreen referrerpolicy="no-referrer"></iframe>
<section id="notice" role="status"><strong>Starting Minecraft…</strong><p>The game is loaded automatically from its public Horizon web build. No file upload is needed. WebGPU support and a substantial initial download are required. If it does not display inside the player, use <a href="https://alexboops.github.io/mc-rust-onweb/" target="_self" style="color:#a7edbd">Open game directly</a>.</p><button id="dismiss">Close</button></section>
<script>
const game=document.getElementById("game");
document.getElementById("reload").onclick=()=>{game.src="https://alexboops.github.io/mc-rust-onweb/";};
document.getElementById("fullscreen").onclick=()=>game.requestFullscreen?.();
document.getElementById("dismiss").onclick=()=>{document.getElementById("notice").hidden=true;};
game.addEventListener("load",()=>{setTimeout(()=>{document.getElementById("notice").hidden=true;},4000);},{once:true});
</script></body></html>
