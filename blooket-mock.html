<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blooket mock — join flow</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1b2d; color: #f2f6ff; font: 16px/1.4 "Segoe UI", system-ui, sans-serif; }
  main { width: min(420px, 92vw); background: #16243a; border: 1px solid #2f4666; border-radius: 14px; padding: 22px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.hint { margin: 0 0 16px; color: #9fb3cd; font-size: 13px; }
  input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 10px; border: 1px solid #3c5878; background: #0d1727; color: #fff; font-size: 16px; }
  button { margin-top: 12px; width: 100%; padding: 11px; border-radius: 10px; border: 0; background: #2f7cff; color: #fff; font-size: 15px; cursor: pointer; }
  button:disabled { background: #2c4a72; cursor: default; }
  .blooks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .blookChoice { margin: 0; padding: 18px 0; background: #1e3352; font-size: 22px; }
  .blookChoice.picked { outline: 2px solid #56d364; }
  .answers { display: grid; gap: 8px; margin-top: 14px; }
  .answer { width: 100%; padding: 10px; border-radius: 9px; background: #23395c; color: #fff; border: 1px solid #3a5779; }
  .muted { color: #8fa6c2; font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
<div id="cookieBanner" style="position:fixed;inset:0;background:#000000aa;display:grid;place-items:end center;padding:24px;z-index:9">
  <div style="background:#16243a;border:1px solid #2f4666;border-radius:12px;padding:16px;max-width:420px">
    <p style="margin:0 0 10px;font-size:13px">Cookies are small files placed on your device that collect information.</p>
    <button id="rejectCookies" style="background:#2c4a72">Reject All</button>
    <button id="acceptCookies">Accept All</button>
  </div>
</div>
<main>
  <div id="screen"></div>
  <p class="muted" id="who"></p>
</main>
<script>
(() => {
  // Identity lives in this frame's own storage: the shim turns that into a
  // per-bot namespace, so each bot gets a different player id.
  const store = window.localStorage;
  if (!store.getItem("mockPlayerId")) {
    store.setItem("mockPlayerId", "player-" + Math.random().toString(36).slice(2, 8));
  }
  const playerId = store.getItem("mockPlayerId");
  window.sessionStorage.setItem("mockSession", playerId);
  document.getElementById("who").textContent = "player " + playerId + " · storage " + (window.location.search || "none");

  const screen = document.getElementById("screen");
  let picked = "";

  // Real Blooket puts a consent banner over the join form until it is answered.
  const banner = document.getElementById("cookieBanner");
  document.getElementById("acceptCookies").addEventListener("click", () => { store.setItem("mockCookies", "accepted"); banner.remove(); });
  document.getElementById("rejectCookies").addEventListener("click", () => { store.setItem("mockCookies", "rejected"); banner.remove(); });

  const renderCode = () => {
    screen.innerHTML = '<h1>Enter a Game ID</h1><p class="hint">Ask your teacher for the code.</p>' +
      '<form id="codeForm"><input type="tel" placeholder="Game ID" autocomplete="off"><button type="submit">Join</button></form>';
    const form = document.getElementById("codeForm");
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const code = form.querySelector("input").value.trim();
      if (!/^[0-9]{6}$/.test(code)) {
        screen.querySelector(".hint").textContent = "Invalid game ID.";
        return;
      }
      store.setItem("mockCode", code);
      renderName(code);
    });
  };

  const renderName = (code) => {
    screen.innerHTML = '<h1>Game ' + code + '</h1><p class="hint">Pick a name and a Blook.</p>' +
      '<form id="nameForm"><input type="text" placeholder="Nickname" autocomplete="off"></form>' +
      '<div class="blooks">' +
      ["🐸", "🐙", "🦊", "🐼", "🐝", "🦉"].map((face, i) => '<button type="button" class="blookChoice" data-face="' + face + '">' + face + '</button>').join("") +
      '</div><button id="joinGame" disabled>Join Game</button>';
    const form = document.getElementById("nameForm");
    const join = document.getElementById("joinGame");
    screen.querySelectorAll(".blookChoice").forEach((button) => {
      button.addEventListener("click", () => {
        picked = button.dataset.face;
        screen.querySelectorAll(".blookChoice").forEach((other) => other.classList.toggle("picked", other === button));
        join.disabled = false;
      });
    });
    join.addEventListener("click", () => {
      const name = form.querySelector("input").value.trim();
      if (name.length < 2) { screen.querySelector(".hint").textContent = "Names need at least 2 characters."; return; }
      store.setItem("mockName", name);
      store.setItem("mockBlook", picked);
      renderLobby(name, picked);
    });
  };

  const renderLobby = (name, blook) => {
    screen.innerHTML = '<h1>You are in!</h1><p class="hint">Waiting for the host to start…</p>' +
      '<p class="muted">' + blook + " " + name + "</p><div class=\"answers\" id=\"q\"></div>";
    setTimeout(() => {
      const q = document.getElementById("q");
      if (!q) return;
      q.innerHTML = '<div class="questionText">What is 2 + 2?</div>' +
        '<button class="answer">3</button><button class="answer">4</button><button class="answer">5</button>';
      q.querySelectorAll(".answer").forEach((button) => {
        button.addEventListener("click", () => { store.setItem("mockAnswer", button.textContent); });
      });
    }, 2500);
  };

  renderCode();
})();
</script>
</body>
</html>
