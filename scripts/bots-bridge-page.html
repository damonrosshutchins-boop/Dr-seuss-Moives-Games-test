<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blooket bots — local program</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101010; color: #f2f2f2; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { width: min(520px, 92vw); background: #1a1a1a; border: 1px solid #3d3d3d; border-radius: 14px; padding: 22px; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  p.hint { margin: 0 0 16px; color: #b9b9b9; font-size: 13px; }
  label { display: grid; gap: 6px; font-weight: 600; font-size: 13px; }
  input, textarea { background: #111; border: 1px solid #4a4a4a; border-radius: 9px; color: #f2f2f2; padding: 9px 11px; font: inherit; width: 100%; box-sizing: border-box; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .actions { display: flex; gap: 10px; margin: 14px 0 10px; }
  button { border: 1px solid #5a5a5a; background: #262626; color: #f2f2f2; border-radius: 9px; padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  button.primary { background: #f2f2f2; color: #111; border-color: #f2f2f2; }
  button:disabled { opacity: .5; cursor: default; }
  #state { font-size: 13px; color: #d6d6d6; min-height: 20px; }
  ol { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; font-size: 12.5px; max-height: 220px; overflow: auto; }
  li { background: #1b1b1b; border: 1px solid #3d3d3d; border-radius: 8px; padding: 8px 10px; color: #d6d6d6; }
  li.ok { border-color: #8f8f8f; color: #fff; }
  li.err { border-color: #c9c9c9; background: #2b2b2b; color: #fff; }
</style>
</head>
<body>
<main>
  <h1>Blooket bots</h1>
  <p class="hint">This page is served by the bot program on your computer, so it can start it directly. Bots answer every question with a random option.</p>
  <div class="row">
    <label>Game code<input id="code" inputmode="numeric" maxlength="8" placeholder="1234567"></label>
    <label>How many bots<input id="count" type="number" min="1" max="25" step="1" value="3"></label>
  </div>
  <label>Names (optional, one per line)<textarea id="names" rows="3" placeholder="alex&#10;sam"></textarea></label>
  <div class="actions">
    <button class="primary" id="start" type="button">Send bots</button>
    <button id="stop" type="button" disabled>Stop</button>
  </div>
  <div id="state" role="status" aria-live="polite">Checking the bot program…</div>
  <ol id="log"></ol>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const log = (text, kind) => {
    const line = document.createElement("li");
    line.textContent = text;
    if (kind) line.className = kind;
    $("log").appendChild(line);
    $("log").scrollTop = $("log").scrollHeight;
  };
  async function call(path, options) {
    const response = await fetch(path, options);
    return { status: response.status, data: await response.json().catch(() => ({})) };
  }
  async function health() {
    try {
      const { data } = await call("/health", { method: "GET" });
      $("state").textContent = data.running
        ? "Bots are already running for game " + data.code + "."
        : "Bot program ready. Enter the game code and press Send bots.";
      $("stop").disabled = !data.running;
    } catch (error) {
      $("state").textContent = "The bot program is not answering on this page.";
    }
  }
  $("start").onclick = async () => {
    const code = ($("code").value || "").trim();
    const count = Math.max(1, Math.min(25, Number($("count").value) || 3));
    const names = ($("names").value || "").split(/[\n,]+/).map((name) => name.trim()).filter(Boolean).slice(0, count);
    if (!/^\d{4,8}$/.test(code)) { $("state").textContent = "Type the 4 to 8 digit game code from the host screen."; $("code").focus(); return; }
    $("start").disabled = true;
    try {
      const { status, data } = await call("/bots", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ code, count, names })
      });
      if (status === 202) {
        log("Started " + data.count + " bot" + (data.count === 1 ? "" : "s") + " for game " + data.code, "ok");
        $("state").textContent = "Bots are joining game " + code + ". Watch the terminal window for progress.";
        $("stop").disabled = false;
      } else {
        const message = data.error || "The bot program refused the request (" + status + ")";
        log(message, "err");
        $("state").textContent = message;
      }
    } catch (error) {
      log("Could not reach the bot program: " + error.message, "err");
      $("state").textContent = "Could not reach the bot program.";
    } finally {
      $("start").disabled = false;
    }
  };
  $("stop").onclick = async () => {
    $("stop").disabled = true;
    try {
      const { data } = await call("/stop", { method: "POST" });
      log(data.stopped ? "Stopped the bots for game " + data.code : "No bot run is active.", data.stopped ? "ok" : "");
    } catch (error) {
      log("Could not reach the bot program: " + error.message, "err");
    }
    void health();
  };
  void health();
</script>
</body>
</html>
