name: Deploy Cinema Arcade to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published browser assets
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://damonrosshutchins-boop.github.io/Dr-seuss-Moives-Games-test"
          for file in scram/scramjet.js controller/controller.api.js controller/controller.sw.js utils/scramjet-utils.js libcurl/index.mjs games/plants-vs-zombies-ds/index.html games/mario-kart-64/index.html games/1v1-lol/index.html games/fnae/index.html games/zelda-oot/index.html games/centipede-arcade/index.html; do
            echo "Checking $BASE/$file"
            curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors --max-time 20 -o /tmp/asset-check "$BASE/$file"
            test -s /tmp/asset-check
            if [[ "$file" != games/* ]] && head -c 200 /tmp/asset-check | grep -Eiq '<!DOCTYPE html|<html'; then
              echo "::error::Expected JavaScript but received HTML for $file"
              exit 1
            fi
          done
          echo "Published assets are reachable."
