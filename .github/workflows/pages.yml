name: Deploy Cinema Arcade to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Check server, proxy, and build script syntax
        run: |
          node --check server.mjs
          node --check proxy-client.js
          node --check scripts/build-pages.mjs
      - run: npm run build:pages
      - name: Import provided Eaglercraft 26.2 HTML if publicly downloadable
        shell: bash
        run: |
          set -euo pipefail
          DEST="dist/games/eaglercraft-26-2/game.html"
          mkdir -p "$(dirname "$DEST")"
          # The linked Drive file contains a 75 MB self-contained HTML client.
          # Do not use private Drive credentials in a public deployment.
          if python3 -m pip install --quiet gdown && timeout 180s python3 - <<'PY'
          from pathlib import Path
          import gdown
          path=Path("dist/games/eaglercraft-26-2/game.html")
          try:
              result=gdown.download(id="1T_FB8ctddUmYePhOnZopTOwHhmZj76UD",output=str(path),quiet=True)
              if not result or path.stat().st_size < 70_000_000:
                  raise RuntimeError("Public Drive download did not return the complete client")
              with path.open("rb") as f:
                  f.seek(max(0,path.stat().st_size-150_000))
                  tail=f.read()
              if b'Eaglercraft 26.2' not in tail or b'</html>' not in tail:
                  raise RuntimeError("Downloaded file is not the expected Eaglercraft 26.2 HTML")
              print("Verified publicly downloadable Eaglercraft file:",path.stat().st_size,"bytes")
          except Exception as e:
              path.unlink(missing_ok=True)
              raise SystemExit("No public Eaglercraft download: "+str(e))
          PY
          then
            echo "Eaglercraft 26.2 included in the GitHub Pages artifact."
          else
            rm -f "$DEST"
            echo "::warning::Drive file isn't publicly downloadable by GitHub Actions. The in-site launcher can still load the original HTML selected by the user."
          fi
      - name: Verify in-site games and restricted proxy routing
        run: node scripts/check-arcade-routing.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published browser assets
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://damonrosshutchins-boop.github.io/Dr-seuss-Moives-Games-test"
          for file in scram/scramjet.js controller/controller.api.js controller/controller.sw.js utils/scramjet-utils.js libcurl/index.mjs games/plants-vs-zombies-ds/index.html games/mario-kart-64/index.html games/1v1-lol/index.html games/fnae/index.html games/zelda-oot/index.html games/centipede-arcade/index.html games/run-2/index.html games/uwu-client/index.html games/tomb-of-the-mask/index.html games/snow-rider-3d/index.html games/btd6/index.html games/repo-halloween/index.html games/garten-of-banban/index.html games/webcompiled/index.html games/eaglercraft-26-2/index.html games/gamble-with-your-friends/index.html games/buckshot/index.html seuss-search.html; do
            echo "Checking $BASE/$file"
            curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors --max-time 20 -o /tmp/asset-check "$BASE/$file"
            test -s /tmp/asset-check
            if [[ "$file" != games/* && "$file" != *.html ]] && head -c 200 /tmp/asset-check | grep -Eiq '<!DOCTYPE html|<html'; then
              echo "::error::Expected JavaScript but received HTML for $file"
              exit 1
            fi
          done
          echo "Published assets are reachable."
  cloudflare-deploy:
    # The arcade relay (pinned game asset routes plus Wisp) lives in
    # cloudflare/arcade. Add a CLOUDFLARE_API_TOKEN repository secret with the
    # "Edit Cloudflare Workers" permission to deploy it from CI; without the
    # secret this job reports a notice and stops, because the Worker can also be
    # deployed by hand with `npx wrangler deploy`.
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check for a Cloudflare API token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; cloudflare/arcade was not deployed from CI."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the arcade relay
        if: steps.token.outputs.present == 'true'
        working-directory: cloudflare/arcade
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy
