name: Keep the Wisp relay warm

# The arcade relay (game asset routes plus Wisp) runs on Cloudflare Workers, so
# there is no idle sleep to defeat; this scheduled probe still reports when the
# Worker or its pinned upstreams stop answering.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warm the relay
        env:
          RELAY_HEALTH_URL: ${{ vars.RELAY_HEALTH_URL || 'https://seuss-arcade-relay.damonrosshutchins.workers.dev/health' }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -m 45 -w '%{http_code}' "$RELAY_HEALTH_URL" || echo 000)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::Relay never answered 200 from $RELAY_HEALTH_URL"
          exit 1
