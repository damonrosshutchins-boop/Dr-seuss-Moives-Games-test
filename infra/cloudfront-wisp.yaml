AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Optional CloudFront WebSocket front end for the existing restricted Seuss
  Cinema Wisp relay on Render. Creates an AWS distribution; deployment may incur AWS charges.

Resources:
  SeussWispCloudFront:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Seuss Cinema - HTTPS/WSS route to restricted Render Wisp relay
        PriceClass: PriceClass_100
        IPV6Enabled: true
        Origins:
          - Id: seuss-render-relay
            DomainName: seuss-cinema-arcade.onrender.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: seuss-render-relay
          ViewerProtocolPolicy: https-only
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
          Compress: false
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
Outputs:
  DistributionDomainName:
    Description: Copy this distribution domain into the arcade Settings CloudFront field.
    Value: !GetAtt SeussWispCloudFront.DomainName
  WispWebSocketUrl:
    Description: CloudFront-secured WebSocket URL for this restricted relay.
    Value: !Sub 'wss://${SeussWispCloudFront.DomainName}/wisp/'
